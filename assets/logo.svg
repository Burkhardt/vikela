<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181816"/>
      <stop offset="100%" stop-color="#23231F"/>
    </linearGradient>

    <!-- Shield Face Gradients: Modernist African Ochre & Gold -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8214"/>
    </linearGradient>
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#C29B27"/>
    </linearGradient>

    <!-- Spine / Qondisa Axis Gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F0"/>
      <stop offset="50%" stop-color="#E2E2D8"/>
      <stop offset="100%" stop-color="#F4F4F0"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Outer Architectural Framing Ring (Cascais / Swiss Precision Grid) -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#2E2E2A" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#3A3A34" stroke-width="1.5"/>

  <!-- Modernist Nguni Shield (Ihawu) Silhouette -->
  <!-- The elliptical, pointed African shield contour: slender, sovereign, aerodynamic -->
  <g filter="url(#subtleGlow)">
    <!-- Left Wing (Live Object State / RaiGuard counterpart) -->
    <path d="M 256,64 
             C 170,120 132,185 132,256 
             C 132,327 170,392 256,448 
             L 256,64 Z" 
          fill="url(#shieldLeft)" />

    <!-- Right Wing (Python Delta Stream / Replicated State) -->
    <path d="M 256,64 
             C 342,120 380,185 380,256 
             C 380,327 342,392 256,448 
             L 256,64 Z" 
          fill="url(#shieldRight)" />

    <!-- Imigabelo / Structural Lacing (Geometric Rhythm inspired by Karabo Poppy & Swiss Grids) -->
    <!-- Abstracted chevron cuts indicating clean delta boundaries -->
    <!-- Upper Lacing -->
    <path d="M 188,186 L 240,186 L 232,200 L 196,200 Z" fill="#181816" opacity="0.85"/>
    <path d="M 324,186 L 272,186 L 280,200 L 316,200 Z" fill="#181816" opacity="0.7"/>

    <!-- Mid-Upper Lacing -->
    <path d="M 174,226 L 240,226 L 232,240 L 182,240 Z" fill="#181816" opacity="0.85"/>
    <path d="M 338,226 L 272,226 L 280,240 L 330,240 Z" fill="#181816" opacity="0.7"/>

    <!-- Mid-Lower Lacing -->
    <path d="M 174,272 L 240,272 L 232,286 L 182,286 Z" fill="#181816" opacity="0.85"/>
    <path d="M 338,272 L 272,272 L 280,286 L 330,286 Z" fill="#181816" opacity="0.7"/>

    <!-- Lower Lacing -->
    <path d="M 188,312 L 240,312 L 232,326 L 196,326 Z" fill="#181816" opacity="0.85"/>
    <path d="M 324,312 L 272,312 L 280,326 L 316,326 Z" fill="#181816" opacity="0.7"/>

    <!-- The Qondisa Axis (The Central Spine / Umgobo) -->
    <!-- The plumb line that straightens crooked mutations -->
    <line x1="256" y1="44" x2="256" y2="468" stroke="url(#spineGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Top & Bottom Spine Tips (Staff finials) -->
    <circle cx="256" cy="44" r="5" fill="#F4F4F0"/>
    <circle cx="256" cy="468" r="5" fill="#F4F4F0"/>

    <!-- Core Center Sentinel Node (The Immutable Protected Attribute) -->
    <circle cx="256" cy="256" r="14" fill="#181816"/>
    <circle cx="256" cy="256" r="7" fill="#F4F4F0"/>
  </g>
</svg>
